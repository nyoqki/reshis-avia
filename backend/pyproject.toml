[project]
name = "rehis"
version = "0.1.0"
description = "Reshis Avia demand forecast API"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.7",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rehis"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# Test files import rehis modules before the task that adds them exists; without this,
# ruff classifies a not-yet-existing rehis submodule as third-party and the sort flips later.
[tool.ruff.lint.isort]
known-first-party = ["rehis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
